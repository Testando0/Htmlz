<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131b21">
  <meta name="description" content="Programmer’s Flowers — uma coroa botânica animada.">
  <title>Programmer’s Flowers 🌷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <header class="heading">
      <p class="eyebrow">a little garden in code</p>
      <h1>Programmer’s <span>Flowers</span> <span class="tulip" aria-hidden="true">🌷</span></h1>
      <p class="subtitle">grown one line at a time</p>
    </header>

    <section class="artwork" aria-label="Coroa floral botânica animada">
      <div class="glow" aria-hidden="true"></div>
      <svg id="flower-frame" viewBox="0 0 440 500" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Coroa de flores em rosa-pêssego e verde-água</title>
        <desc id="svg-desc">Uma coroa simétrica de hastes, folhas e flores delicadas sobre fundo azul-marinho.</desc>
        <defs>
          <radialGradient id="petal" cx="35%" cy="25%" r="80%">
            <stop offset="0" stop-color="#ffd8cb"/>
            <stop offset=".58" stop-color="#f3a99f"/>
            <stop offset="1" stop-color="#c87582"/>
          </radialGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b7f4dc"/>
            <stop offset="1" stop-color="#4fafa8"/>
          </linearGradient>
          <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a4e5cf"/>
            <stop offset="1" stop-color="#478e8c"/>
          </linearGradient>
          <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <g id="leaf-shape">
            <path d="M0 0 C-19 -19 -37 -13 -38 2 C-23 15 -9 12 0 0Z" fill="url(#leaf)" stroke="#a7e9d4" stroke-width="1.1"/>
            <path d="M-2 0 Q-19 1 -34 3" fill="none" stroke="#3b8884" stroke-width="1" opacity=".8"/>
          </g>
          <g id="flower-shape">
            <ellipse cy="-13" rx="8.5" ry="14" fill="url(#petal)"/>
            <ellipse cx="12" cy="-5" rx="8.5" ry="14" transform="rotate(58 12 -5)" fill="url(#petal)"/>
            <ellipse cx="8" cy="10" rx="8.5" ry="14" transform="rotate(125 8 10)" fill="url(#petal)"/>
            <ellipse cx="-8" cy="10" rx="8.5" ry="14" transform="rotate(-125 -8 10)" fill="url(#petal)"/>
            <ellipse cx="-12" cy="-5" rx="8.5" ry="14" transform="rotate(-58 -12 -5)" fill="url(#petal)"/>
            <circle r="6.2" fill="#f7d39a"/>
            <circle r="2.1" fill="#a86c68"/>
          </g>
          <g id="bud-shape">
            <path d="M0 11 C-12 3 -11 -9 -3 -14 C-1 -8 2 -8 4 -15 C14 -6 11 4 0 11Z" fill="#e9a5a0" stroke="#f4c5b7" stroke-width="1"/>
            <path d="M0 10 Q-1 0 1 -8" stroke="#b86e7b" fill="none" stroke-width="1"/>
          </g>
        </defs>

        <g id="BaseGroup" fill="none" stroke="url(#stem)" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw" d="M220 440 C157 416 111 365 89 303 C62 226 91 150 145 105 C173 82 197 71 220 69"/>
          <path class="draw" d="M220 440 C283 416 329 365 351 303 C378 226 349 150 295 105 C267 82 243 71 220 69"/>
          <path class="draw" d="M220 440 C195 399 190 366 199 328 C208 291 220 270 220 239 C220 199 206 164 220 128"/>
          <path class="draw" d="M220 440 C245 399 250 366 241 328 C232 291 220 270 220 239 C220 199 234 164 220 128" opacity=".8"/>
        </g>

        <g id="LeafGroup">
          <use href="#leaf-shape" transform="translate(130 366) rotate(205)"/>
          <use href="#leaf-shape" transform="translate(108 321) rotate(15) scale(.9)"/>
          <use href="#leaf-shape" transform="translate(91 272) rotate(205) scale(.85)"/>
          <use href="#leaf-shape" transform="translate(100 220) rotate(5)"/>
          <use href="#leaf-shape" transform="translate(119 174) rotate(205) scale(.9)"/>
          <use href="#leaf-shape" transform="translate(154 133) rotate(0) scale(.8)"/>
          <use href="#leaf-shape" transform="translate(177 103) rotate(205) scale(.72)"/>
          <use href="#leaf-shape" transform="translate(310 366) rotate(-25) scale(-1 1)"/>
          <use href="#leaf-shape" transform="translate(332 321) rotate(165) scale(-.9 .9)"/>
          <use href="#leaf-shape" transform="translate(349 272) rotate(-25) scale(-.85 .85)"/>
          <use href="#leaf-shape" transform="translate(340 220) rotate(175) scale(-1 1)"/>
          <use href="#leaf-shape" transform="translate(321 174) rotate(-25) scale(-.9 .9)"/>
          <use href="#leaf-shape" transform="translate(286 133) rotate(180) scale(-.8 .8)"/>
          <use href="#leaf-shape" transform="translate(263 103) rotate(-25) scale(-.72 .72)"/>
          <use href="#leaf-shape" transform="translate(199 330) rotate(220) scale(.75)"/>
          <use href="#leaf-shape" transform="translate(198 275) rotate(12) scale(.65)"/>
          <use href="#leaf-shape" transform="translate(203 220) rotate(220) scale(.6)"/>
          <use href="#leaf-shape" transform="translate(241 330) rotate(-40) scale(-.75 .75)"/>
          <use href="#leaf-shape" transform="translate(242 275) rotate(168) scale(-.65 .65)"/>
          <use href="#leaf-shape" transform="translate(237 220) rotate(-40) scale(-.6 .6)"/>
        </g>

        <g id="Flourish" fill="none" stroke="#80cfc0" stroke-width="1.6" stroke-linecap="round">
          <path class="draw" d="M163 414 C133 416 119 397 131 384 C141 374 154 385 148 393 C144 398 137 394 140 390"/>
          <path class="draw" d="M277 414 C307 416 321 397 309 384 C299 374 286 385 292 393 C296 398 303 394 300 390"/>
          <path class="draw" d="M174 451 C191 462 207 459 220 447 C233 459 249 462 266 451"/>
          <path class="draw" d="M182 458 Q169 473 158 460 Q155 451 166 451"/>
          <path class="draw" d="M258 458 Q271 473 282 460 Q285 451 274 451"/>
          <path class="draw" d="M177 120 Q161 101 174 91 Q187 85 190 98"/>
          <path class="draw" d="M263 120 Q279 101 266 91 Q253 85 250 98"/>
        </g>

        <g id="PinkFlowerGroup">
          <use href="#flower-shape" transform="translate(88 301) scale(.92)"/>
          <use href="#flower-shape" transform="translate(101 216) scale(.8)"/>
          <use href="#flower-shape" transform="translate(144 144) scale(.86)"/>
          <use href="#flower-shape" transform="translate(184 95) scale(.72)"/>
          <use href="#flower-shape" transform="translate(352 301) scale(.92)"/>
          <use href="#flower-shape" transform="translate(339 216) scale(.8)"/>
          <use href="#flower-shape" transform="translate(296 144) scale(.86)"/>
          <use href="#flower-shape" transform="translate(256 95) scale(.72)"/>
          <use href="#flower-shape" transform="translate(220 128) scale(1.05)"/>
          <use href="#flower-shape" transform="translate(199 367) scale(.62)"/>
          <use href="#flower-shape" transform="translate(241 367) scale(.62)"/>
        </g>

        <g id="BudGroup">
          <g id="Bud"><use href="#bud-shape" transform="translate(119 257) rotate(-28) scale(.8)"/></g>
          <g id="Bud"><use href="#bud-shape" transform="translate(129 181) rotate(20) scale(.7)"/></g>
          <g id="Bud"><use href="#bud-shape" transform="translate(164 121) rotate(-18) scale(.7)"/></g>
          <g id="Bud"><use href="#bud-shape" transform="translate(321 257) rotate(28) scale(-.8 .8)"/></g>
          <g id="Bud"><use href="#bud-shape" transform="translate(311 181) rotate(-20) scale(-.7 .7)"/></g>
          <g id="Bud"><use href="#bud-shape" transform="translate(276 121) rotate(18) scale(-.7 .7)"/></g>
        </g>

        <g id="Dots" fill="#f7c7bd" filter="url(#soft-glow)">
          <circle cx="65" cy="350" r="2"/><circle cx="74" cy="190" r="1.8"/>
          <circle cx="151" cy="73" r="1.7"/><circle cx="286" cy="73" r="1.7"/>
          <circle cx="366" cy="190" r="1.8"/><circle cx="375" cy="350" r="2"/>
          <circle cx="184" cy="405" r="1.5"/><circle cx="256" cy="405" r="1.5"/>
          <circle cx="220" cy="42" r="2.2"/><circle cx="220" cy="480" r="1.8"/>
        </g>
      </svg>
      <p class="caption">✦ &nbsp; cultivated with care &nbsp; ✦</p>
    </section>
    <footer>made of petals, patience &amp; a little bit of code</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
